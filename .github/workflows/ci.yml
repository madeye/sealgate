name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Tests / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        node: [22, 24]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  sandbox:
    name: Sandbox / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    env:
      CLAUDE_VERSION: 2.1.270
      DISABLE_AUTOUPDATER: '1'
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Install pinned native Claude
        run: |
          curl --fail --silent --show-error --location https://claude.ai/install.sh -o "$RUNNER_TEMP/install-claude.sh"
          bash "$RUNNER_TEMP/install-claude.sh" "$CLAUDE_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "SEALGATE_TEST_CLAUDE=$HOME/.local/bin/claude" >> "$GITHUB_ENV"
      - run: npm run validate:plugin
      - name: Build Linux sandbox
        if: runner.os == 'Linux'
        run: node dist/bin/sealgate.js sandbox-build
      - name: Test Linux sandbox with mock providers
        if: runner.os == 'Linux'
        run: npm run test:sandbox
      - name: Test macOS sandbox with mock providers
        if: runner.os == 'macOS'
        run: npm run test:seatbelt

  package:
    name: Package contents and installed CLI
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Pack and check distributable files
        run: |
          mkdir -p artifacts
          npm pack --ignore-scripts --json --pack-destination artifacts > "$RUNNER_TEMP/package-manifest.json"
          node .github/scripts/check-package.mjs "$RUNNER_TEMP/package-manifest.json"
      - name: Smoke test installed package without development dependencies
        run: |
          npm install --global --prefix "$RUNNER_TEMP/sealgate-install" --ignore-scripts --no-audit --no-fund ./artifacts/*.tgz
          "$RUNNER_TEMP/sealgate-install/bin/sealgate" --help
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package
          path: artifacts/*.tgz
          if-no-files-found: error
          retention-days: 7
